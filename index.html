<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>True or False? AI, learning, and your classroom</title>
<link rel="preload" href="fonts/oswald-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Oswald";font-style:normal;font-weight:500 700;font-display:swap;src:url(fonts/oswald-latin-ext.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C4,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"Oswald";font-style:normal;font-weight:500 700;font-display:swap;src:url(fonts/oswald-latin.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Public Sans";font-style:normal;font-weight:400 800;font-display:swap;src:url(fonts/public-sans-latin-ext.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C4,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"Public Sans";font-style:normal;font-weight:400 800;font-display:swap;src:url(fonts/public-sans-latin.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{
  --bg:#F6F2E9; --surface:#FFFCF5; --surface-2:#ECE5D6; --ink:#15203A; --muted:#4A5570; --line:#DDD4C2; --field:#A99F8B;
  --accent:#A34A15; --stage:#15203A; --stage-ink:#F6F2E9; --stage-muted:#C9D0DE; --stage-card:#1F2C4F; --stage-line:#3A4B78;
  --true-bg:#2D5DA8; --true-ink:#F6F2E9; --false-bg:#F28C38; --false-ink:#15203A; --unk-bg:#CFC6B3; --unk-ink:#15203A;
  --focus:#2D5DA8;
  --display:"Oswald","Avenir Next Condensed","Roboto Condensed","Arial Narrow",sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1830; --surface:#18233F; --surface-2:#22305A; --ink:#F1ECE1; --muted:#B8C0D1; --line:#2E3C63; --field:#5A6A94;
    --accent:#F2A25E; --stage:#1A2644; --stage-ink:#F1ECE1; --stage-muted:#B8C0D1; --stage-card:#24335C;
    --focus:#8FB2EA; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1830; --surface:#18233F; --surface-2:#22305A; --ink:#F1ECE1; --muted:#B8C0D1; --line:#2E3C63; --field:#5A6A94;
  --accent:#F2A25E; --stage:#1A2644; --stage-ink:#F1ECE1; --stage-muted:#B8C0D1; --stage-card:#24335C;
  --focus:#8FB2EA; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  overflow-wrap:normal;word-break:normal;hyphens:manual}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--stage)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3,p{margin:0}
.display{font-family:var(--display);font-weight:600;letter-spacing:.01em;line-height:1.08}

/* Top bar */
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--stage);color:var(--stage-ink)}
.bar-inner{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
.brand{font-family:var(--display);font-weight:600;font-size:20px;white-space:nowrap}
@media (max-width:760px){.brand{display:none}}
nav.steps{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1}
nav.steps::-webkit-scrollbar{display:none}
nav.steps button{flex:none;min-height:44px;border:1px solid transparent;background:transparent;color:var(--stage-muted);padding:7px 12px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
nav.steps button[aria-current="step"]{background:var(--stage-card);color:var(--stage-ink);border-color:var(--stage-line)}
nav.steps button:hover{color:var(--stage-ink)}
.lang{display:flex;flex:none;border:1px solid var(--stage-line);border-radius:999px;overflow:hidden}
.lang button{border:none;background:transparent;color:var(--stage-muted);font-weight:700;font-size:13px;min-width:44px;min-height:44px;padding:0 10px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--stage-ink);color:var(--stage)}

main{max-width:760px;margin:0 auto;padding:24px 16px 48px}
main:focus{outline:none}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.kicker{color:var(--accent);font-weight:700;font-size:15px}
.lede{color:var(--muted);font-size:18px;max-width:60ch}
.muted{color:var(--muted)}
.small{font-size:14px}
.note{font-size:14px;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
.empty{background:var(--surface);border:2px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--muted)}
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;min-height:48px;border:2px solid var(--ink);background:var(--ink);color:var(--bg);font-weight:700;padding:12px 18px;border-radius:12px;cursor:pointer;font-size:16px;text-decoration:none;text-align:center}
.btn.block{width:100%}
.btn.secondary{background:transparent;color:var(--ink)}
.linkbtn{background:none;border:none;color:var(--accent);font-weight:700;cursor:pointer;min-height:44px;padding:0 2px;text-decoration:underline;text-underline-offset:3px}

/* Verdict colors: always shown with their word */
.v-true{background:var(--true-bg);color:var(--true-ink)}
.v-false{background:var(--false-bg);color:var(--false-ink)}
.v-unknown{background:var(--unk-bg);color:var(--unk-ink)}

/* Intro */
.hero{background:var(--stage);color:var(--stage-ink);border-radius:20px;padding:28px 22px 26px;display:flex;flex-direction:column;gap:18px}
.hero h1{font-size:clamp(56px,16vw,96px);text-transform:uppercase}
.hero p{color:var(--stage-muted);font-size:18px;max-width:46ch}
.hero .btn{background:var(--false-bg);border-color:var(--false-bg);color:var(--false-ink);align-self:flex-start}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:.04em;text-transform:uppercase;padding:6px 12px;border-radius:8px}
.howto ol{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.howto li{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.howto b{display:block}

/* Statement */
.stage{background:var(--stage);color:var(--stage-ink);border-radius:20px;padding:22px 20px;display:flex;flex-direction:column;gap:18px}
.stage .count{color:var(--stage-muted);font-size:14px;font-weight:600}
.stage .statement{font-size:clamp(30px,7.4vw,46px)}
.votes{display:grid;gap:10px}
.votes.three{grid-template-columns:repeat(3,1fr)}
.votes.two{grid-template-columns:repeat(2,1fr)}
.vote{min-height:64px;min-width:0;border:none;border-radius:12px;padding:12px 6px;font-family:var(--display);font-weight:600;font-size:20px;letter-spacing:.03em;text-transform:uppercase;cursor:pointer;line-height:1.1}
.vote:hover{filter:brightness(1.06)}
.vote:active{transform:translateY(1px)}
.stamp{align-self:flex-start;font-family:var(--display);font-weight:700;font-size:clamp(34px,9vw,52px);text-transform:uppercase;letter-spacing:.05em;padding:6px 18px;border-radius:10px;transform:rotate(-3deg);animation:stamp .42s cubic-bezier(.2,1.4,.4,1) both}
@keyframes stamp{0%{transform:rotate(-9deg) scale(1.7);opacity:0}100%{transform:rotate(-3deg) scale(1);opacity:1}}
@media (prefers-reduced-motion: reduce){.stamp{animation:none}}
.you{color:var(--stage-muted);font-size:16px}
.reveal{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
.reveal .headline{font-size:22px;line-height:1.25}
.reveal ul{margin:0;padding-left:20px;display:grid;gap:8px}
.source{color:var(--muted);font-size:14px}

/* Round 3 */
.match{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:12px}
.pair{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch}
.pair .plus{align-self:center;font-family:var(--display);font-size:26px;color:var(--accent)}
.half{background:var(--surface-2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.half .lab{font-size:13px;font-weight:700;color:var(--muted)}
.half .chip{align-self:flex-start;font-size:13px;padding:3px 8px}
.project{background:var(--stage);color:var(--stage-ink);border-radius:12px;padding:14px;display:grid;gap:4px}
.project .who{color:var(--stage-muted);font-size:14px}
.project h3{font-size:24px}
@media (max-width:520px){.pair{grid-template-columns:1fr}.pair .plus{justify-self:center;line-height:1}}

/* Lab */
fieldset{border:none;padding:0;margin:0;min-width:0;display:grid;gap:10px}
legend{font-family:var(--display);font-weight:600;font-size:26px;padding:0;margin-bottom:4px}
.picker{display:grid;gap:8px}
.pick{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer}
.pick input{margin-top:4px;accent-color:var(--true-bg);width:20px;height:20px;flex:none}
.pick b{display:block}
.pick .muted{font-size:15px}
.pick:has(input:checked){border-color:var(--true-bg);box-shadow:inset 0 0 0 1px var(--true-bg)}
.combo{background:var(--stage);color:var(--stage-ink);border-radius:18px;padding:18px;display:grid;gap:10px}
.combo .q{font-size:clamp(24px,6vw,32px)}
.combo .x{color:var(--false-bg);font-family:var(--display);font-size:18px}
.combo p{color:var(--stage-muted)}
.combo b{color:var(--stage-ink)}
.field{display:grid;gap:6px}
.field label,.field .lbl{font-weight:700;font-size:15px}
.field .hint{font-size:14px;color:var(--muted)}
input[type=text],textarea,select{width:100%;min-height:48px;background:var(--surface);border:1.5px solid var(--field);border-radius:10px;padding:11px 12px;font-size:16px}
textarea{min-height:84px;resize:vertical}
.checks{display:grid;gap:4px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:16px;min-height:44px;padding-top:10px;cursor:pointer}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--true-bg);flex:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}

/* Check */
.verdict{border-radius:18px;padding:18px;display:grid;gap:6px}
.verdict h2{font-size:clamp(30px,8vw,44px)}
.verdict.good{background:var(--true-bg);color:var(--true-ink)}
.verdict.almost{background:var(--unk-bg);color:var(--unk-ink)}
.verdict.notyet{background:var(--false-bg);color:var(--false-ink)}
.summary{background:var(--surface-2);border-radius:12px;padding:12px 14px;font-size:15px;display:grid;gap:4px}
.checklist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.checklist li{display:grid;grid-template-columns:76px 1fr;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.tag{font-size:12px;font-weight:800;border-radius:6px;padding:3px 0;text-align:center;align-self:start}
.tag.done{background:var(--true-bg);color:var(--true-ink)}
.tag.fix{background:var(--false-bg);color:var(--false-ink)}
.tag.tip{background:var(--surface-2);color:var(--ink)}
.copybox{min-height:220px;font-size:14px;font-family:ui-monospace,Menlo,Consolas,monospace}

/* Next steps */
.link-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:10px}
.link-card h3{font-size:26px}
.link-card .btn{justify-self:start}

footer.foot{max-width:760px;margin:0 auto;padding:0 16px 32px;color:var(--muted);font-size:13px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<header class="bar">
  <div class="bar-inner">
    <span class="brand" id="brand"></span>
    <nav class="steps" id="nav"></nav>
    <div class="lang" role="group" aria-label="Language / Valoda">
      <button type="button" data-lang="en" lang="en">EN</button><button type="button" data-lang="lv" lang="lv">LV</button>
    </div>
  </div>
</header>
<main id="app" tabindex="-1"></main>
<footer class="foot"><p id="foot"></p></footer>
<div class="sr" aria-live="polite" id="live"></div>

<script src="content.js"></script>
<script src="rubric.js"></script>
<script src="adapters.js"></script>
<script>
"use strict";
const { I18N, LINKS } = window.TOF_CONTENT;
const { evaluate } = window.TOF_RUBRIC;
const ADAPTERS = window.TOF_ADAPTERS;

/* ---------- State (kept on this device) ---------- */
const STORE_KEY = "tof-workshop-v1";
const SCREENS = ["intro","r1","r2","r3","lab","check","wall"];
const blankLab = () => ({ q:null, p:null, grade:"", a:"", b:"", aAuto:"", bAuto:"", assign:"", length:"", measure:"", mAuto:"",
                          timing:"", noAI:false, same:false, feel:false, decision:"" });
const fresh = () => ({ screen:"intro", pos:{ r1:0, r2:0 }, votes:{}, lab:blankLab() });
const guessLang = () => { try { return (navigator.languages || [navigator.language || ""]).some(l => /^lv\b/i.test(l)) ? "lv" : "en"; } catch (e) { return "en"; } };
let state = Object.assign({ lang:null }, fresh());
try {
  const saved = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
  if (saved && typeof saved === "object") {
    if (saved.lang === "en" || saved.lang === "lv") state.lang = saved.lang;
    if (SCREENS.includes(saved.screen)) state.screen = saved.screen;
    if (saved.pos && typeof saved.pos === "object") state.pos = { r1:+saved.pos.r1 || 0, r2:+saved.pos.r2 || 0 };
    if (saved.votes && typeof saved.votes === "object") state.votes = saved.votes;
    if (saved.lab && typeof saved.lab === "object") state.lab = Object.assign(blankLab(), saved.lab);
  }
} catch (e) {}
if (!state.lang) state.lang = guessLang();
let saveTimer = null;
function save(){ clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 200); }
function saveNow(){ clearTimeout(saveTimer); try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} }
window.addEventListener("pagehide", saveNow);
document.addEventListener("visibilitychange", () => { if (document.hidden) saveNow(); });

// Transient UI state, not saved
let copyMsg = "", copyFallback = false;

/* ---------- Helpers ---------- */
const T = () => I18N[state.lang];
const U = () => T().ui;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const vclass = v => "v-" + v;
const byId = (arr, id) => arr.find(x => x.id === id);
const label = (pairs, k) => (pairs.find(p => p[0] === k) || [null, ""])[1];
const items = rk => rk === "r1" ? T().R1 : T().R2;
const allItems = () => T().R1.concat(T().R2);
const isRealLink = url => /^https?:\/\/[^/\s]+\.[^/\s]+/i.test(url || "") && !/example\.|placeholder|todo|xxx/i.test(url);
function announce(t){ const l = document.getElementById("live"); l.textContent = ""; setTimeout(() => { l.textContent = t; }, 30); }
function score(){
  let right = 0, answered = 0;
  for (const it of allItems()) { const v = state.votes[it.id]; if (v) { answered++; if (v === it.answer) right++; } }
  return { right, answered };
}
function rerenderInPlace(){ const y = window.scrollY; render(); window.scrollTo({ top:y }); }

/* ---------- Routing: #intro … #wall ---------- */
const hashScreen = () => { const h = location.hash.slice(1); return SCREENS.includes(h) ? h : null; };
function setHash(screen){ if (location.hash !== "#" + screen) try { history.replaceState(null, "", "#" + screen); } catch (e) {} }
function show(screen){
  state.screen = screen; copyMsg = ""; copyFallback = false; saveNow(); setHash(screen); render();
  window.scrollTo({ top:0 }); document.getElementById("app").focus({ preventScroll:true });
}
function go(screen){ if (location.hash !== "#" + screen) try { history.pushState(null, "", "#" + screen); } catch (e) {} show(screen); }

/* ---------- Views ---------- */
function renderChrome(){
  const t = T();
  document.documentElement.lang = state.lang;
  document.title = t.title;
  document.getElementById("brand").textContent = t.brand;
  const nav = document.getElementById("nav");
  nav.setAttribute("aria-label", t.ui.nav);
  nav.innerHTML = t.SCREENS.map(([k, l]) => `<button type="button" data-go="${k}" ${state.screen === k ? 'aria-current="step"' : ""}>${esc(l)}</button>`).join("");
  const cur = nav.querySelector('[aria-current="step"]');
  if (cur) nav.scrollLeft = Math.max(0, cur.offsetLeft - nav.offsetLeft - 16);
  document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === state.lang)));
  document.getElementById("foot").textContent = t.ui.foot;
}
function render(){
  renderChrome();
  const s = state.screen;
  document.getElementById("app").innerHTML =
    s === "r1" || s === "r2" ? viewRound(s) : s === "r3" ? viewR3() : s === "lab" ? viewLab() :
    s === "check" ? viewCheck() : s === "wall" ? viewWall() : viewIntro();
}

function viewIntro(){
  const t = T(), u = U();
  return `
  <div class="stack">
    <section class="hero" aria-labelledby="t">
      <h1 id="t" class="display">${esc(t.brand)}</h1>
      <p>${esc(u.heroP)}</p>
      <div class="chips" aria-hidden="true">${["true","false","unknown"].map(v => `<span class="chip ${vclass(v)}">${esc(t.VERDICT[v])}</span>`).join("")}</div>
      <button class="btn" type="button" data-go="r1">${esc(u.start)}</button>
    </section>
    <section class="howto" aria-label="${esc(u.howtoLabel)}">
      <ol>${u.howto.map(([h, d]) => `<li><b>${esc(h)}</b><span class="muted">${esc(d)}</span></li>`).join("")}</ol>
    </section>
    <p class="note">${esc(u.dataLocal)}</p>
  </div>`;
}

function viewRound(rk){
  const t = T(), u = U(), list = items(rk);
  const i = Math.max(0, Math.min(list.length - 1, state.pos[rk] || 0));
  const it = list[i], voted = state.votes[it.id];
  const opts = rk === "r1" ? ["true","false","unknown"] : ["true","false"];
  const nextLabel = i < list.length - 1 ? u.next : rk === "r1" ? u.toR2 : u.toR3;
  const body = !voted ? `
      <div class="votes ${opts.length === 3 ? "three" : "two"}" role="group" aria-label="${esc(u.yourVote)}">
        ${opts.map(o => `<button type="button" class="vote ${vclass(o)}" data-vote="${o}" data-item="${it.id}">${esc(t.VERDICT[o])}</button>`).join("")}
      </div>` : `
      <div class="stamp ${vclass(it.answer)}">${esc(t.VERDICT[it.answer])}</div>
      <p class="you">${esc(u.youSaid(t.VERDICT[voted]))} ${esc(voted === it.answer ? u.right : u.wrong)}</p>`;
  const reveal = voted ? `
    <section class="reveal" aria-label="${esc(u.evidenceLabel)}">
      ${it.name ? `<p class="kicker">${esc(it.name)}</p>` : ""}
      <p class="headline display">${esc(it.headline)}</p>
      <ul>${it.points.map(p => `<li>${esc(p)}</li>`).join("")}</ul>
      <p class="source">${esc(u.source)} ${esc(it.source)}</p>
    </section>
    <button class="btn block" type="button" data-next="${rk}">${esc(nextLabel)}</button>` : "";
  return `
  <div class="stack">
    <p class="kicker">${esc(rk === "r1" ? u.r1Name : u.r2Name)}</p>
    <section class="stage" aria-label="${esc(u.stmt(i + 1, list.length))}">
      <p class="count">${esc(u.stmt(i + 1, list.length))}</p>
      <h2 class="statement display">${esc(t.q(it.text))}</h2>
      ${body}
    </section>
    ${reveal}
    <div class="row">
      ${i > 0 ? `<button class="linkbtn" type="button" data-prev="${rk}">${esc(u.prev)}</button>` : "<span></span>"}
      ${voted ? `<button class="linkbtn" type="button" data-revote="${it.id}">${esc(u.revote)}</button>` : ""}
    </div>
  </div>`;
}

function viewR3(){
  const t = T(), u = U(), sc = score();
  return `
  <div class="stack">
    <div class="stack" style="gap:8px">
      <p class="kicker">${esc(u.r3Kicker)}</p>
      <p class="lede">${esc(sc.answered ? u.r3Score(sc.right, sc.answered) : u.r3NoScore)}</p>
    </div>
    ${t.R3.map((m, k) => `
      <section class="match" aria-label="${esc(u.matchLabel(k + 1))}">
        <div class="pair">
          <div class="half"><span class="lab">${esc(u.aiClaim)}</span><b>${esc(m.claim)}</b><span class="chip ${vclass(m.claimV)}">${esc(t.VERDICT[m.claimV])}</span></div>
          <span class="plus" aria-hidden="true">+</span>
          <div class="half"><span class="lab">${esc(u.principle)}</span><b>${esc(m.principle)}</b><span class="muted small">${esc(m.principleNote)}</span></div>
        </div>
        ${m.projects.map(p => `<div class="project"><span class="who">${esc(u.testing(p.who))}</span><h3 class="display" lang="en">${esc(p.name)}</h3><p>${esc(p.what)}</p></div>`).join("")}
      </section>`).join("")}
    <p class="note">${esc(u.r3Note)}</p>
    <button class="btn block" type="button" data-go="lab">${esc(u.designOwn)}</button>
  </div>`;
}

function viewLab(){
  const t = T(), u = U(), L = state.lab;
  const q = byId(t.QUESTIONS, L.q), p = byId(t.PRINCIPLES, L.p);
  const pick = (name, list, cur, sub) => list.map(x => `
    <label class="pick"><input type="radio" name="${name}" value="${x.id}" ${cur === x.id ? "checked" : ""}>
      <span><b>${esc(name === "q" ? x.title : x.name)}</b><span class="muted">${esc(sub(x))}</span></span></label>`).join("");
  const pname = p ? (u.lowerName ? p.name.toLowerCase() : p.name) : "";
  const combo = q && p ? `
    <section class="combo" aria-label="${esc(u.pairing)}">
      <p class="x">${esc(u.pairing)}</p>
      <h2 class="q display">${esc(q.title)}</h2>
      <p>${u.through(`<b>${esc(pname)}</b>`, esc(p.idea))}</p>
    </section>
    ${designForm(L)}` : `<p class="empty">${esc(u.pickFirst)}</p>`;
  return `
  <div class="stack">
    <div class="stack" style="gap:8px"><p class="kicker">${esc(u.labKicker)}</p><p class="lede">${esc(u.labLede)}</p></div>
    <fieldset><legend>${esc(u.leg1)}</legend><div class="picker">${pick("q", t.QUESTIONS, L.q, x => x.evidence)}</div></fieldset>
    <fieldset><legend>${esc(u.leg2)}</legend><div class="picker">${pick("p", t.PRINCIPLES, L.p, x => x.idea)}</div></fieldset>
    ${combo}
  </div>`;
}
function opt(pairs, cur, placeholder){
  return `<option value="" ${!cur ? "selected" : ""} disabled>${esc(placeholder)}</option>` +
    pairs.map(([k, l]) => `<option value="${k}" ${cur === k ? "selected" : ""}>${esc(l)}</option>`).join("");
}
function designForm(L){
  const t = T(), u = U();
  return `
  <fieldset><legend>${esc(u.leg3)}</legend>
    <div class="field"><label for="f-grade">${esc(u.fClass)}</label><input id="f-grade" type="text" data-f="grade" maxlength="80" placeholder="${esc(u.fClassPh)}" value="${esc(L.grade)}"></div>
    <div class="field"><label for="f-a">${esc(u.fA)}</label><span class="hint" id="h-a">${esc(u.fAHint)}</span><textarea id="f-a" data-f="a" maxlength="300" aria-describedby="h-a">${esc(L.a)}</textarea></div>
    <div class="field"><label for="f-b">${esc(u.fB)}</label><span class="hint" id="h-b">${esc(u.fBHint)}</span><textarea id="f-b" data-f="b" maxlength="300" aria-describedby="h-b">${esc(L.b)}</textarea></div>
    <div class="grid2">
      <div class="field"><label for="f-assign">${esc(u.fAssign)}</label><select id="f-assign" data-f="assign">${opt(t.ASSIGN, L.assign, u.choose)}</select></div>
      <div class="field"><label for="f-length">${esc(u.fLength)}</label><select id="f-length" data-f="length">${opt(t.LENGTH, L.length, u.choose)}</select></div>
    </div>
    <div class="field"><label for="f-measure">${esc(u.fMeasure)}</label><input id="f-measure" type="text" data-f="measure" maxlength="200" value="${esc(L.measure)}"></div>
    <div class="field"><label for="f-timing">${esc(u.fTiming)}</label><select id="f-timing" data-f="timing">${opt(t.TIMING, L.timing, u.choose)}</select></div>
    <fieldset class="field"><legend class="lbl" style="font-family:inherit;font-size:15px;margin:0">${esc(u.checkAll)}</legend>
      <div class="checks">
        <label class="check"><input type="checkbox" data-f="noAI" ${L.noAI ? "checked" : ""}> ${esc(u.cNoAI)}</label>
        <label class="check"><input type="checkbox" data-f="same" ${L.same ? "checked" : ""}> ${esc(u.cSame)}</label>
        <label class="check"><input type="checkbox" data-f="feel" ${L.feel ? "checked" : ""}> ${esc(u.cFeel)}</label>
      </div></fieldset>
    <div class="field"><label for="f-decision">${esc(u.fDecision)}</label><input id="f-decision" type="text" data-f="decision" maxlength="200" placeholder="${esc(u.fDecisionPh)}" value="${esc(L.decision)}"></div>
    <button class="btn block" type="button" data-go="check">${esc(u.checkBtn)}</button>
  </fieldset>`;
}

function designSummary(L){
  const t = T(), u = U();
  const q = byId(t.QUESTIONS, L.q), p = byId(t.PRINCIPLES, L.p);
  return `<div class="summary">
    <span><b>${esc(q.title)}</b></span>
    <span>${esc(u.sumPrinciple)}: ${esc(p.name)}${L.grade ? ` · ${esc(L.grade)}` : ""}</span>
    <span>A: ${esc(L.a)}</span><span>B: ${esc(L.b)}</span>
    <span>${esc(u.sumMeasure)}: ${esc(L.measure || u.notSet)}${L.timing ? `, ${esc(label(t.TIMING, L.timing).toLowerCase())}` : ""}</span>
  </div>`;
}
// Plain-text version for "Copy my design", in the player's current language.
function designText(L){
  const t = T(), u = U(), ev = evaluate(L);
  const q = byId(t.QUESTIONS, L.q), p = byId(t.PRINCIPLES, L.p);
  const line = (cond, text) => cond ? text : null;  // null = line left out
  return [
    q.title,
    `${u.sumPrinciple}: ${p.name}`,
    line(L.grade, `${u.fClass}: ${L.grade}`),
    `${u.fA}: ${L.a}`,
    `${u.fB}: ${L.b}`,
    line(L.assign, `${u.fAssign}: ${label(t.ASSIGN, L.assign)}`),
    line(L.length, `${u.fLength}: ${label(t.LENGTH, L.length)}`),
    `${u.fMeasure}: ${L.measure || u.notSet}`,
    line(L.timing, `${u.fTiming}: ${label(t.TIMING, L.timing)}`),
    line(L.noAI, `✓ ${u.cNoAI}`), line(L.same, `✓ ${u.cSame}`), line(L.feel, `✓ ${u.cFeel}`),
    line(L.decision, `${u.fDecision} ${L.decision}`),
    "",
    `${u.verdictLabel}: ${t.VERDICT_COPY[ev.verdict][0]}`,
    ...ev.items.map(x => `[${u.tags[x.s]}] ${u.ev[x.key]}`),
    "",
    u.ethics
  ].filter(x => x !== null).join("\n");
}

function viewCheck(){
  const t = T(), u = U(), L = state.lab;
  const head = `<p class="kicker">${esc(u.checkKicker)}</p>`;
  if (!L.q || !L.p) return `<div class="stack">${head}<p class="empty">${esc(u.checkNeedPair)}</p>
    <button class="btn block" type="button" data-go="lab">${esc(u.goLab)}</button></div>`;
  const ev = evaluate(L);
  const [title, sub] = t.VERDICT_COPY[ev.verdict];
  return `
  <div class="stack">
    ${head}
    <section class="verdict ${ev.verdict}" aria-label="${esc(u.verdictLabel)}"><h2 class="display">${esc(title)}</h2><p>${esc(sub)}</p></section>
    ${designSummary(L)}
    <ul class="checklist">${ev.items.map(x => `<li><span class="tag ${x.s}">${esc(u.tags[x.s])}</span><span>${esc(u.ev[x.key])}</span></li>`).join("")}</ul>
    <p class="note">${esc(u.ethics)}</p>
    ${ADAPTERS.data ? "" : `<p class="note">${esc(u.shareOff)}</p>`}
    <button class="btn block" type="button" data-action="copy">${esc(u.copy)}</button>
    <p class="note" role="status" ${copyMsg ? "" : "hidden"}>${esc(copyMsg)}</p>
    ${copyFallback ? `<label class="field"><span class="sr">${esc(u.copyBoxLabel)}</span><textarea class="copybox" readonly id="copybox">${esc(designText(L))}</textarea></label>` : ""}
    <div class="row">
      <button class="linkbtn" type="button" data-go="lab">${esc(u.editDesign)}</button>
      <button class="linkbtn" type="button" data-go="wall">${esc(u.seeWall)}</button>
    </div>
    ${nextSteps()}
  </div>`;
}

function viewWall(){
  const u = U();
  return `
  <div class="stack">
    <p class="kicker">${esc(u.wallKicker)}</p>
    <p class="empty">${esc(u.wallOff)}</p>
    <button class="btn secondary block" type="button" data-go="lab">${esc(u.another)}</button>
    ${nextSteps()}
  </div>`;
}

function nextSteps(){
  const u = U();
  const cards = [
    { url:LINKS.tinkery, name:u.tinkeryName, body:u.tinkeryBody, cta:u.tinkeryCta },
    { url:LINKS.flashLab, name:u.flashName, body:u.flashBody, cta:u.flashCta }
  ].filter(c => isRealLink(c.url));
  if (!cards.length) return "";
  return `
  <section class="stack" aria-labelledby="next-h" style="margin-top:12px">
    <h2 id="next-h" class="kicker">${esc(u.nextKicker)}</h2>
    ${cards.map(c => `
      <div class="link-card">
        <h3 class="display">${esc(c.name)}</h3>
        <p class="muted">${esc(c.body)}</p>
        <a class="btn" href="${esc(c.url)}" target="_blank" rel="noopener noreferrer">${esc(c.cta)}<span class="sr"> ${esc(u.newTab)}</span></a>
      </div>`).join("")}
  </section>`;
}

/* ---------- Language switch ---------- */
function setLang(lang){
  if (lang === state.lang || !I18N[lang]) return;
  const from = I18N[state.lang], to = I18N[lang], L = state.lab;
  // Swap starter text the player hasn't edited into the new language; leave edited text alone.
  const swap = (field, autoField, list, id, key) => {
    const a = byId(from[list], id), b = byId(to[list], id);
    if (!a || !b) return;
    if (!L[field] || L[field] === a[key]) L[field] = b[key];
    L[autoField] = b[key];
  };
  swap("a", "aAuto", "PRINCIPLES", L.p, "serve");
  swap("b", "bAuto", "PRINCIPLES", L.p, "bypass");
  swap("measure", "mAuto", "QUESTIONS", L.q, "measure");
  state.lang = lang; copyMsg = ""; copyFallback = false;
  saveNow(); rerenderInPlace();
}

/* ---------- Events ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  const d = b.dataset;
  if (d.lang) { setLang(d.lang); return; }
  if (d.go) { go(d.go); return; }
  if (d.vote) {
    state.votes[d.item] = d.vote; saveNow(); render();
    const it = allItems().find(x => x.id === d.item);
    announce(U().announce(T().VERDICT[it.answer]));
    return;
  }
  if (d.revote) { delete state.votes[d.revote]; saveNow(); render(); return; }
  if (d.next) {
    const rk = d.next;
    if (state.pos[rk] < items(rk).length - 1) { state.pos[rk]++; saveNow(); render(); window.scrollTo({ top:0 }); }
    else go(rk === "r1" ? "r2" : "r3");
    return;
  }
  if (d.prev) { state.pos[d.prev] = Math.max(0, state.pos[d.prev] - 1); saveNow(); render(); return; }
  if (d.action === "copy") copyDesign();
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.name === "q" || el.name === "p") {
    const t = T(), L = state.lab;
    L[el.name] = el.value;
    const q = byId(t.QUESTIONS, L.q), p = byId(t.PRINCIPLES, L.p);
    // Prefill starters; replace on re-pick only if the player hasn't edited them.
    if (p) { if (!L.a || L.a === L.aAuto) L.a = p.serve; L.aAuto = p.serve; if (!L.b || L.b === L.bAuto) L.b = p.bypass; L.bAuto = p.bypass; }
    if (q) { if (!L.measure || L.measure === L.mAuto) L.measure = q.measure; L.mAuto = q.measure; }
    saveNow(); rerenderInPlace();
    document.querySelector(`input[name="${el.name}"][value="${el.value}"]`)?.focus({ preventScroll:true });
    if (q && p) announce(U().announcePair);
    return;
  }
  if (el.dataset && el.dataset.f) setField(el);
});
document.addEventListener("input", e => { const el = e.target; if (el.dataset && el.dataset.f && el.type !== "checkbox") setField(el); });
function setField(el){ state.lab[el.dataset.f] = el.type === "checkbox" ? el.checked : el.value; save(); }

async function copyDesign(){
  const u = U(), text = designText(state.lab);
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch (e) {}
  copyMsg = ok ? u.copied : u.copyManual;
  copyFallback = !ok;
  rerenderInPlace();
  if (!ok) { const box = document.getElementById("copybox"); if (box) { box.focus(); box.select(); } }
}

window.addEventListener("hashchange", () => { const h = hashScreen(); if (h && h !== state.screen) show(h); });

/* ---------- Start ---------- */
const fromHash = hashScreen();
if (fromHash) state.screen = fromHash;
setHash(state.screen);
render();
// Offline after first load. Only on a real http(s) host; a missing sw.js just means no offline cache.
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
</script>
